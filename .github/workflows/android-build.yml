name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and protect debug certificate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          git diff --quiet "origin/$BASE_REF...HEAD" -- keystore/karoon-debug.jks.base64 || {
            echo "::error::Debug signing certificate is immutable."; exit 1;
          }
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^app/'; then
            BASE_VERSION=$(git show "origin/$BASE_REF:app/build.gradle.kts" | sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*$/\1/p' | head -n1)
            HEAD_VERSION=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*$/\1/p' app/build.gradle.kts | head -n1)
            test -n "$BASE_VERSION" && test -n "$HEAD_VERSION"
            test "$HEAD_VERSION" -gt "$BASE_VERSION"
          fi

      - name: Restore debug signing keystore
        run: |
          set -euo pipefail
          base64 -d keystore/karoon-debug.jks.base64 > keystore/karoon-debug.jks
          test -s keystore/karoon-debug.jks

      - name: Fetch native tunnel source
        run: |
          set -e
          JNI_DIR="app/src/main/jni"
          rm -rf "$JNI_DIR/hev-socks5-tunnel"
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git "$JNI_DIR/hev-socks5-tunnel"
          printf '%s\n' 'APP_OPTIM := release' 'APP_PLATFORM := android-26' 'APP_ABI := armeabi-v7a arm64-v8a x86 x86_64' 'APP_CFLAGS := -O3 -DANDROID' 'APP_SUPPORT_FLEXIBLE_PAGE_SIZES := true' > "$JNI_DIR/Application.mk"
          printf '%s\n' 'include $(call all-subdir-makefiles)' > "$JNI_DIR/Android.mk"
          test -f "$JNI_DIR/hev-socks5-tunnel/src/hev-jni.c"

      - name: Download Xray-core Android binaries
        run: |
          set -e
          XRAY_TAG="v25.9.11"
          BASE="https://github.com/XTLS/Xray-core/releases/download/${XRAY_TAG}"
          mkdir -p app/src/main/assets/xray/arm64-v8a app/src/main/assets/xray/armeabi-v7a
          for pair in "arm64-v8a:Xray-android-arm64-v8a.zip" "armeabi-v7a:Xray-android-arm32-v7a.zip"; do
            abi="${pair%%:*}"; file="${pair##*:}"
            curl -fsSL -o "/tmp/$file" "$BASE/$file" || continue
            rm -rf /tmp/xray-extract; mkdir -p /tmp/xray-extract
            unzip -qo "/tmp/$file" -d /tmp/xray-extract
            BIN=$(find /tmp/xray-extract -type f -name xray | head -n1)
            test -n "$BIN"; cp "$BIN" "app/src/main/assets/xray/$abi/xray"
            chmod +x "app/src/main/assets/xray/$abi/xray"
          done
          test -s app/src/main/assets/xray/arm64-v8a/xray

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 36 and native tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify debug APK certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          OUT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$OUT"
          echo "$OUT" | tr '[:upper:]' '[:lower:]' | grep -Fq "06f03d3a6552183cf9a9fce276c1e9490e942c67fa51f885a5baec26fdbfd1b0"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: karoon-tunnel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore private Play upload keystore
        if: env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != ''
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > keystore/play-upload.jks
          test -s keystore/play-upload.jks

      - name: Build signed Play Store AAB
        if: env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != ''
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify signed Play Store AAB
        if: env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != ''
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"

      - name: Upload Play Store AAB
        if: env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: karoon-tunnel-play-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
